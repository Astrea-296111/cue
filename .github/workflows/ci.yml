name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
    inputs:
      whisper_runtime:
        description: Also verify the optional downloaded Whisper runtime
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Essential tests (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in main.js preload.js electron-builder.cjs renderer/*.js src/*.js scripts/*.js scripts/*.cjs scripts/lib/*.cjs test/*.test.js test/*.cjs; do
            node --check "$file"
          done

      - name: Run essential tests
        run: npm test

  package-windows:
    name: Package Windows
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native Windows capture exclusion
        run: npm run test:protection -- --native-only

      - name: Verify actual Windows UI and native synthetic hotkeys
        env:
          CUE_UI_SETTINGS_SCREENSHOT: artifacts/windows-ui/settings.png
          CUE_UI_SCREEN_SCREENSHOT: artifacts/windows-ui/vibe.png
          CUE_UI_DIAGNOSTIC_FILE: artifacts/windows-ui/diagnostic.json
          CUE_UI_QA_BENCHMARK_FILE: artifacts/windows-ui/qa-ui-performance.json
          CUE_UI_WINDOWS_SHORTCUT_FILE: artifacts/windows-ui/shortcuts.json
        run: npm run test:ui

      - name: Retain Windows UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-${{ github.run_id }}
          path: artifacts/windows-ui/
          if-no-files-found: warn

      - name: Package Windows app
        run: npm run pack:win

  # Explicitly requested maintenance check; not part of normal text Q&A CI.
  # macOS is deliberately not in this matrix. Windows and Linux fetch immutable
  # GitHub *release assets*, so their pinned checksums hold. macOS builds from
  # source via https://github.com/.../archive/refs/tags/<tag>.zip — a GitHub
  # auto-generated archive, which is NOT byte-stable: GitHub can recompress it,
  # the SHA-256 changes, and the pin fails permanently through no fault of ours.
  # That is exactly what happened here. Re-adding macOS needs the source archive
  # mirrored somewhere immutable first, not a fresh hash that will rot again.
  runtime-smoke:
    name: Local runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && inputs.whisper_runtime
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore prepared runtime
        uses: actions/cache@v4
        with:
          path: .cache/whisper-runtime
          key: whisper-runtime-1.9.1-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare pinned runtime
        run: npm run prepare:whisper

      - name: Launch runtime smoke test
        run: npm run verify:whisper-runtime
