name: Real dual-channel audio fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require trusted main
        env:
          TRUSTED_REF: ${{ github.ref }}
        run: test "$TRUSTED_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install without provider credentials
        run: npm ci
      - name: Feed public synthetic audio through production ASR and dialogue
        timeout-minutes: 3
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_ASR_API_KEY || secrets.QWEN_API_KEY }}
          QWEN_LLM_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL || vars.QWEN_MODEL_ID }}
          CUE_AUDIO_REAL_LLM: "true"
          QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
          QWEN_ASR_MODEL: ${{ vars.QWEN_ASR_MODEL }}
          QWEN_ASR_WEBSOCKET_URL: ${{ vars.QWEN_ASR_WEBSOCKET_URL }}
        run: node scripts/evaluate-audio-fixture.cjs artifacts/audio-fixture
      - name: Retain synthetic-only ASR result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-dual-audio-${{ github.run_id }}
          path: artifacts/audio-fixture/
          if-no-files-found: warn
          retention-days: 7
